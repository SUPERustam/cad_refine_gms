use_vllm: true
vllm_server_port: 8000
bf16: true
gradient_checkpointing: true
remove_unused_columns: false
ddp_find_unused_parameters: false
beta: 0
weight_decay: 0

output_dir: rl_checkpoints/rl_mae_train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2

max_completion_length: 3500
max_prompt_length: 600

log_completions: false
logging_steps: 30
num_generations: 16
generation_batch_size: 384
report_to: ["comet_ml"]
run_name: grpo_mae_render_2
num_train_epochs: 20
save_strategy: steps
save_steps: 400

temperature: 1.0
top_p: 1.0
top_k: 100
importance_sampling_level: token
loss_type: dr_grpo
epsilon: 0.1
num_iterations: 3
scale_rewards: false

learning_rate: 1e-5

# RewardArgs - MAE render metric
failure_reward: 0
iou_coef: 0
cd_coef: 0
auc_coef: 0
aoc_gms_coef: 0
mae_coef: 10

get_aoc_gms: false
get_mae_render: true

print_sample_steps: 25
pool_size: 40
r_mode: "10_mae_render"

# TrainingArgs
clip_cov: false
top_samples: 4
